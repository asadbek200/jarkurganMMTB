<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Yangiliklar — jarkurganMMTB.uz</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#1a6b3c;--green3:#e6f5ec;--gold:#c8a227;--text:#1a2a1e;--text3:#6b8c73;--white:#fff;--bg:#f6fbf8;--border:#d4e8db}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text)}
a{text-decoration:none;color:inherit}
nav{background:var(--green);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.nav-logo{display:flex;align-items:center;gap:12px;padding:.8rem 0}
.nav-logo-icon{width:44px;height:44px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--green)}
.nav-logo-text strong{display:block;font-size:15px;font-weight:700;color:#fff}
.nav-logo-text span{font-size:12px;color:rgba(255,255,255,.8)}
.nav-links{display:flex;gap:4px}
.nav-links a{color:#fff;font-size:14px;font-weight:600;padding:8px 14px;border-radius:6px;opacity:.9}
.nav-links a:hover,.nav-links a.active{background:rgba(255,255,255,.15);opacity:1}
.page-header{background:linear-gradient(135deg,#0f3d22,#1a6b3c);color:#fff;padding:3rem 2rem;text-align:center}
.page-header h1{font-family:'Playfair Display',serif;font-size:2rem;margin-bottom:.5rem}
.page-header p{opacity:.8}
section{padding:3rem 2rem}
.inner{max-width:1060px;margin:0 auto}
.news-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.5rem}
.news-card{background:var(--white);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:box-shadow .2s,transform .2s;display:block}
.news-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.09);transform:translateY(-2px)}
.news-img{height:160px;background:var(--green3);display:flex;align-items:center;justify-content:center;font-size:3rem;overflow:hidden}
.news-img img{width:100%;height:100%;object-fit:cover}
.news-body{padding:1.2rem}
.news-cat{display:inline-block;background:var(--green3);color:var(--green);font-size:11px;font-weight:700;padding:3px 10px;border-radius:10px;margin-bottom:6px}
.news-date{font-size:12px;color:var(--text3);margin-bottom:6px}
.news-card h3{font-size:15px;font-weight:700;line-height:1.4;margin-bottom:6px}
.news-card p{font-size:13px;color:var(--text3);line-height:1.6}
.pagination{display:flex;gap:8px;justify-content:center;margin-top:2rem;flex-wrap:wrap}
.pagination a,.pagination span{display:inline-block;padding:8px 16px;border-radius:20px;font-size:14px;font-weight:600;border:1px solid var(--border);color:var(--text)}
.pagination a:hover{background:var(--green);color:#fff;border-color:var(--green)}
.pagination .active{background:var(--green);color:#fff;border-color:var(--green)}
.empty{text-align:center;padding:4rem;color:var(--text3)}
footer{background:#0a2e18;color:#fff;padding:1.5rem 2rem;text-align:center;font-size:13px;opacity:.7}
@media(max-width:600px){.nav-links{display:none}}
</style>
</head>
<body>
<nav>
  <div class="nav-logo">
    <div class="nav-logo-icon">J</div>
    <div class="nav-logo-text">
      <strong th:text="${settings.siteName}">jarkurganMMTB.uz</strong>
      <span>Maktabgacha va maktab ta'limi bo'limi</span>
    </div>
  </div>
  <div class="nav-links">
    <a href="/">Bosh sahifa</a>
    <a href="/news" class="active">Yangiliklar</a>
    <a href="/#schools">Maktablar</a>
    <a href="/#contact">Murojaat</a>
  </div>
</nav>

<div class="page-header">
  <h1>Yangiliklar</h1>
  <p>Bo'limimiz va tumanidagi ta'lim yangiliklari</p>
</div>

<section>
  <div class="inner">
    <div th:if="${newsPage.totalElements == 0}" class="empty">
      <p style="font-size:2rem;margin-bottom:1rem">📰</p>
      <p>Hozircha yangiliklar yo'q</p>
    </div>
    <div class="news-grid" th:unless="${newsPage.totalElements == 0}">
      <a class="news-card" th:each="n : ${newsPage.content}" th:href="@{/news/{id}(id=${n.id})}">
        <div class="news-img">
          <img th:if="${n.imageUrl}" th:src="${n.imageUrl}" th:alt="${n.title}"/>
          <span th:unless="${n.imageUrl}">📰</span>
        </div>
        <div class="news-body">
          <span class="news-cat" th:text="${n.category}">YANGILIK</span>
          <div class="news-date" th:text="${#temporals.format(n.createdAt,'dd.MM.yyyy')}"></div>
          <h3 th:text="${n.title}">Sarlavha</h3>
          <p th:text="${n.shortDesc}">Qisqacha...</p>
        </div>
      </a>
    </div>
    <!-- Pagination -->
    <div class="pagination" th:if="${newsPage.totalPages > 1}">
      <a th:if="${currentPage > 0}" th:href="@{/news(page=${currentPage-1})}">← Oldingi</a>
      <th:block th:each="i : ${#numbers.sequence(0, newsPage.totalPages - 1)}">
        <a th:href="@{/news(page=${i})}" th:text="${i+1}"
           th:classappend="${i == currentPage} ? ' active' : ''"></a>
      </th:block>
      <a th:if="${currentPage < newsPage.totalPages - 1}" th:href="@{/news(page=${currentPage+1})}">Keyingi →</a>
    </div>
  </div>
</section>

<footer>
  <p th:text="'© 2025 ' + ${settings.siteName}">© 2025 jarkurganMMTB.uz</p>
</footer>
</body>
</html>
