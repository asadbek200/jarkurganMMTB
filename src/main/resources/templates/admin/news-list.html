<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Yangiliklar — Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#1a6b3c;--green3:#e6f5ec;--gold:#c8a227;--text:#1a2a1e;--text3:#6b8c73;--white:#fff;--bg:#f0f7f3;--border:#d4e8db;--sidebar:240px}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
.sidebar{width:var(--sidebar);background:var(--green);position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;z-index:10}
.sb-logo{padding:1.2rem 1.5rem;border-bottom:1px solid rgba(255,255,255,.12)}
.sb-logo strong{display:block;font-size:14px;font-weight:700;color:#fff}
.sb-logo span{font-size:11px;color:rgba(255,255,255,.65)}
.sb-menu{padding:.8rem 0;flex:1}
.sb-menu a{display:flex;align-items:center;gap:10px;padding:.7rem 1.5rem;color:rgba(255,255,255,.82);font-size:14px;font-weight:500;transition:background .18s;text-decoration:none}
.sb-menu a:hover,.sb-menu a.active{background:rgba(255,255,255,.14);color:#fff}
.sb-menu a .ic{font-size:18px;width:22px;text-align:center}
.sb-bottom{padding:1rem 1.5rem;border-top:1px solid rgba(255,255,255,.12)}
.sb-bottom a{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.7);font-size:13px;text-decoration:none}
.main{margin-left:var(--sidebar);flex:1;display:flex;flex-direction:column}
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:.8rem 1.5rem;display:flex;align-items:center;justify-content:space-between}
.topbar h1{font-size:17px;font-weight:700}
.content{padding:1.5rem}
.flash-ok{background:#e6f5ec;color:#1a6b3c;border:1px solid #b2dfcc;border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:1rem}
.btn{display:inline-block;padding:9px 18px;border-radius:20px;font-size:13px;font-weight:700;border:none;cursor:pointer;text-decoration:none;transition:opacity .18s}
.btn:hover{opacity:.85}
.btn-green{background:var(--green);color:#fff}
.btn-gold{background:var(--gold);color:var(--text)}
.btn-red{background:#e53935;color:#fff}
.btn-gray{background:#e0e0e0;color:#333}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:14px}
.card{background:var(--white);border:1px solid var(--border);border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;padding:.7rem 1.2rem;border-bottom:1px solid var(--border);background:#fafcfa}
td{padding:.8rem 1.2rem;font-size:14px;border-bottom:1px solid #f0f5f1;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f8fdf9}
.pub-yes{background:#e6f5ec;color:#1a6b3c;font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px}
.pub-no{background:#f5f5f5;color:#757575;font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px}
.td-btns{display:flex;gap:6px;flex-wrap:wrap}
.pagination{display:flex;gap:8px;margin-top:1rem;flex-wrap:wrap}
.pagination a,.pagination span{padding:7px 14px;border-radius:16px;font-size:13px;font-weight:600;border:1px solid var(--border);color:var(--text);text-decoration:none}
.pagination a:hover{background:var(--green);color:#fff;border-color:var(--green)}
.pagination .active{background:var(--green);color:#fff;border-color:var(--green)}
</style>
</head>
<body>
<div class="sidebar">
  <div class="sb-logo"><strong>jarkurganMMTB.uz</strong><span>Admin panel</span></div>
  <div class="sb-menu">
    <a href="/admin/dashboard"><span class="ic">📊</span> Dashboard</a>
    <a href="/admin/news" class="active"><span class="ic">📰</span> Yangiliklar</a>
    <a href="/admin/schools"><span class="ic">🏫</span> Maktablar</a>
    <a href="/admin/documents"><span class="ic">📄</span> Hujjatlar</a>
    <a href="/admin/contacts"><span class="ic">📩</span> Murojaatlar</a>
    <a href="/admin/settings"><span class="ic">⚙️</span> Sozlamalar</a>
  </div>
  <div class="sb-bottom"><a href="/"><span>🌐</span> Saytni ko'rish</a></div>
  <div class="sb-bottom"><a href="/logout"><span>🚪</span> Chiqish</a></div>
</div>
<div class="main">
  <div class="topbar">
    <h1>Yangiliklar</h1>
    <a href="/admin/news/new" class="btn btn-green">+ Yangi yangilik</a>
  </div>
  <div class="content">
    <div class="flash-ok" th:if="${success}" th:text="${success}"></div>
    <div class="card">
      <table>
        <tr><th>Sarlavha</th><th>Kategoriya</th><th>Sana</th><th>Holati</th><th>Amallar</th></tr>
        <tr th:if="${newsPage.totalElements == 0}">
          <td colspan="5" style="text-align:center;color:#6b8c73;padding:2rem">Yangiliklar yo'q</td>
        </tr>
        <tr th:each="n : ${newsPage.content}">
          <td th:text="${#strings.abbreviate(n.title,60)}">Sarlavha</td>
          <td th:text="${n.category}">Kat</td>
          <td th:text="${#temporals.format(n.createdAt,'dd.MM.yyyy')}">Sana</td>
          <td><span th:class="${n.published ? 'pub-yes' : 'pub-no'}" th:text="${n.published ? 'Chop etilgan' : 'Qoralama'}"></span></td>
          <td>
            <div class="td-btns">
              <a th:href="@{/admin/news/edit/{id}(id=${n.id})}" class="btn btn-gold btn-sm">✏️ Tahrir</a>
              <form th:action="@{/admin/news/publish/{id}(id=${n.id})}" method="post" style="display:inline">
                <button type="submit" class="btn btn-gray btn-sm" th:text="${n.published ? '🙈 Yashir' : '👁 Chop et'}">Chop</button>
              </form>
              <form th:action="@{/admin/news/delete/{id}(id=${n.id})}" method="post" style="display:inline"
                    onsubmit="return confirm('Haqiqatan o\'chirasizmi?')">
                <button type="submit" class="btn btn-red btn-sm">🗑 O'chir</button>
              </form>
            </div>
          </td>
        </tr>
      </table>
    </div>
    <div class="pagination" th:if="${newsPage.totalPages > 1}">
      <a th:if="${currentPage > 0}" th:href="@{/admin/news(page=${currentPage-1})}">← Oldingi</a>
      <th:block th:each="i : ${#numbers.sequence(0, newsPage.totalPages - 1)}">
        <a th:href="@{/admin/news(page=${i})}" th:text="${i+1}" th:classappend="${i==currentPage}?' active':''"></a>
      </th:block>
      <a th:if="${currentPage < newsPage.totalPages - 1}" th:href="@{/admin/news(page=${currentPage+1})}">Keyingi →</a>
    </div>
  </div>
</div>
</body>
</html>
