<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title th:text="${news.title} + ' — jarkurganMMTB.uz'">Yangilik</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#1a6b3c;--green3:#e6f5ec;--gold:#c8a227;--text:#1a2a1e;--text3:#6b8c73;--white:#fff;--bg:#f6fbf8;--border:#d4e8db}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text)}
a{text-decoration:none;color:inherit}
nav{background:var(--green);padding:0 2rem;display:flex;align-items:center;gap:12px;padding:.8rem 2rem;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.nav-icon{width:40px;height:40px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--green)}
nav strong{color:#fff;font-size:15px}
nav a.back{margin-left:auto;color:rgba(255,255,255,.8);font-size:14px}
nav a.back:hover{color:#fff}
.main{max-width:860px;margin:2rem auto;padding:0 1.5rem;display:grid;grid-template-columns:1fr 280px;gap:2rem;align-items:start}
article{background:var(--white);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.art-img{max-height:360px;overflow:hidden}
.art-img img{width:100%;object-fit:cover}
.art-body{padding:2rem}
.art-meta{display:flex;gap:10px;align-items:center;margin-bottom:1.2rem;flex-wrap:wrap}
.art-cat{background:var(--green3);color:var(--green);font-size:12px;font-weight:700;padding:4px 12px;border-radius:12px}
.art-date{font-size:13px;color:var(--text3)}
.art-body h1{font-family:'Playfair Display',serif;font-size:clamp(1.3rem,3vw,1.9rem);margin-bottom:1.5rem;line-height:1.3}
.art-content{font-size:15px;line-height:1.85;color:#2d4a36;white-space:pre-wrap}
.sidebar h3{font-size:14px;font-weight:700;color:var(--green);margin-bottom:1rem;padding-bottom:6px;border-bottom:2px solid var(--green3)}
.side-card{display:flex;gap:10px;padding:.8rem 0;border-bottom:1px solid var(--border);cursor:pointer}
.side-card:last-child{border-bottom:none}
.side-card:hover h4{color:var(--green)}
.side-card h4{font-size:13px;font-weight:700;line-height:1.4;margin-bottom:3px}
.side-card p{font-size:12px;color:var(--text3)}
.side-card .sc-img{width:60px;height:50px;background:var(--green3);border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.3rem;overflow:hidden}
.side-card .sc-img img{width:100%;height:100%;object-fit:cover}
footer{background:#0a2e18;color:#fff;padding:1.5rem 2rem;text-align:center;font-size:13px;opacity:.7;margin-top:3rem}
@media(max-width:700px){.main{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav>
  <div class="nav-icon">J</div>
  <strong th:text="${settings.siteName}">jarkurganMMTB.uz</strong>
  <a class="back" href="/news">← Yangiliklarga qaytish</a>
</nav>

<div class="main">
  <article>
    <div class="art-img" th:if="${news.imageUrl}">
      <img th:src="${news.imageUrl}" th:alt="${news.title}"/>
    </div>
    <div class="art-body">
      <div class="art-meta">
        <span class="art-cat" th:text="${news.category}">YANGILIK</span>
        <span class="art-date" th:text="${#temporals.format(news.createdAt,'dd.MM.yyyy')}"></span>
      </div>
      <h1 th:text="${news.title}">Yangilik sarlavhasi</h1>
      <div class="art-content" th:text="${news.content}">Mazmun...</div>
    </div>
  </article>

  <aside>
    <div style="background:var(--white);border:1px solid var(--border);border-radius:14px;padding:1.2rem">
      <h3>So'nggi yangiliklar</h3>
      <a class="side-card" th:each="n : ${latestNews}" th:href="@{/news/{id}(id=${n.id})}">
        <div class="sc-img">
          <img th:if="${n.imageUrl}" th:src="${n.imageUrl}" th:alt="${n.title}"/>
          <span th:unless="${n.imageUrl}">📰</span>
        </div>
        <div>
          <h4 th:text="${n.title}">Sarlavha</h4>
          <p th:text="${#temporals.format(n.createdAt,'dd.MM.yyyy')}"></p>
        </div>
      </a>
    </div>
  </aside>
</div>

<footer><p th:text="'© 2025 ' + ${settings.siteName}">© 2025</p></footer>
</body>
</html>
